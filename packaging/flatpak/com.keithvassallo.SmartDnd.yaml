app-id: com.keithvassallo.SmartDnd
runtime: org.gnome.Platform
runtime-version: '51'
sdk: org.gnome.Sdk
command: smart-dnd

finish-args:
  # Preferences window
  - --share=ipc
  - --socket=wayland
  - --socket=fallback-x11
  - --device=dri
  # Tray icon (StatusNotifierItem)
  - --talk-name=org.kde.StatusNotifierWatcher
  # Read calendars through the host's Evolution Data Server
  - --talk-name=org.gnome.evolution.dataserver.Sources5
  - --talk-name=org.gnome.evolution.dataserver.Calendar8
  - --talk-name=org.gnome.evolution.dataserver.Subprocess.Backend.*
  # Toggle DND through the notification daemon's CLI on the host (caelestia,
  # swaync-client, dunstctl) via flatpak-spawn --host
  - --talk-name=org.freedesktop.Flatpak
  # Re-evaluate after suspend/resume
  - --system-talk-name=org.freedesktop.login1
  # IPC socket shared by the daemon and GUI, which run as separate sandbox instances
  - --filesystem=xdg-run/smart-dnd:create
  # Start at login: read the autostart entry, and write it on desktops without the
  # Background portal (e.g. Hyprland); GNOME and KDE go through the portal
  - --filesystem=xdg-config/autostart:create

modules:
  # libical and the Evolution Data Server client libraries are not in the GNOME
  # runtime. Only the client side is used: it talks to the host's EDS services.
  - name: libical
    buildsystem: cmake-ninja
    config-opts:
      - -DCMAKE_BUILD_TYPE=Release
      - -DCMAKE_INSTALL_LIBDIR:PATH=/app/lib
      - -DBUILD_SHARED_LIBS=ON
      - -DICAL_BUILD_DOCS=OFF
      - -DWITH_CXX_BINDINGS=OFF
      - -DICAL_GLIB=ON
      - -DGOBJECT_INTROSPECTION=ON
      - -DICAL_GLIB_VAPI=OFF
      - -DLIBICAL_BUILD_TESTING=OFF
    cleanup:
      - /include
      - /lib/cmake
      - /lib/pkgconfig
      - /share/gir-1.0
    sources:
      - type: archive
        url: https://github.com/libical/libical/releases/download/v3.0.20/libical-3.0.20.tar.gz
        sha256: e73de92f5a6ce84c1b00306446b290a2b08cdf0a80988eca0a2c9d5c3510b4c2

  - name: evolution-data-server
    buildsystem: cmake-ninja
    config-opts:
      - -DCMAKE_BUILD_TYPE=Release
      - -DENABLE_INTROSPECTION=ON
      - -DENABLE_CANBERRA=OFF
      - -DENABLE_GOA=OFF
      - -DENABLE_DOT_LOCKING=OFF
      - -DENABLE_FILE_LOCKING=fcntl
      - -DENABLE_GTK=OFF
      - -DENABLE_GTK4=OFF
      - -DENABLE_GOOGLE=OFF
      - -DENABLE_VALA_BINDINGS=OFF
      - -DENABLE_WEATHER=OFF
      - -DWITH_OPENLDAP=OFF
      - -DWITH_LIBDB=OFF
      - -DENABLE_INSTALLED_TESTS=OFF
      - -DENABLE_GTK_DOC=OFF
      - -DENABLE_EXAMPLES=OFF
      - -DENABLE_OAUTH2_WEBKITGTK=OFF
      - -DENABLE_OAUTH2_WEBKITGTK4=OFF
    cleanup:
      - /include
      - /lib/pkgconfig
      - /share/gir-1.0
      - /share/GConf
      - /share/dbus-1
      - /lib/systemd
      - /share/applications
    sources:
      - type: archive
        url: https://download.gnome.org/sources/evolution-data-server/3.62/evolution-data-server-3.62.0.tar.xz
        sha256: 78be88e9a511f5afe7ff2e363eade84b622dd0282647fc576edb2d4ff2962cba

  # Build backend for smart-dnd itself; not shipped in the app.
  - name: hatchling
    buildsystem: simple
    build-commands:
      - pip3 install --no-index --find-links=. --prefix=${FLATPAK_DEST} hatchling
    cleanup:
      - '*'
    sources:
      - type: file
        url: https://files.pythonhosted.org/packages/5f/80/91f51f439c05d4ec4623c22928ce16a938d6d793bf709477830823497859/hatchling-1.32.4-py3-none-any.whl
        sha256: 08ecf7548fb48205e7f213d70c71e67b8271b7242093dc3f1da578b42c734a2c
      - type: file
        url: https://files.pythonhosted.org/packages/f1/d9/7fb5aa316bc299258e68c73ba3bddbc499654a07f151cba08f6153988714/pathspec-1.1.1-py3-none-any.whl
        sha256: a00ce642f577bf7f473932318056212bc4f8bfdf53128c78bbd5af0b9b20b189
      - type: file
        url: https://files.pythonhosted.org/packages/54/20/4d324d65cc6d9205fabedc306948156824eb9f0ee1633355a8f7ec5c66bf/pluggy-1.6.0-py3-none-any.whl
        sha256: e920276dd6813095e9377c0bc5566d94c932c33b27a3e3945d8389c374dd4746
      - type: file
        url: https://files.pythonhosted.org/packages/30/81/0da8afb52a71d0a4f2bd3152357b1a441e393b286374802b9d3addab4ab5/trove_classifiers-2026.9.21.13-py3-none-any.whl
        sha256: 8b1ff4f9c191b1040b71c37f1e445ab99732911e3cd91de52838453a854d7a17
      - type: file
        url: https://files.pythonhosted.org/packages/13/bc/8c13eb66537dce1d2bd3a57132902f38d0e7f5bb46fa9f4daed9fe9d76ee/tomlkit-0.15.1-py3-none-any.whl
        sha256: 177a05aece5a8ca5266fd3c448abb47b8d352f09d477d3ca8332db4d89b24304
      - type: file
        url: https://files.pythonhosted.org/packages/63/34/ba1c580383c9eada3711951fef0795c80b829a078d72188184bcab9dd527/packaging-26.3-py3-none-any.whl
        sha256: d7193f7c8e4e93f444fde0262bf90af30e16fa0ad0ad44cb553c87339b23cd1c

  - name: smart-dnd
    buildsystem: simple
    build-commands:
      # PyGObject comes from the runtime, hence --no-deps.
      - pip3 install --no-index --no-deps --no-build-isolation --prefix=${FLATPAK_DEST} .
      - install -Dm644 data/com.keithvassallo.SmartDnd.desktop ${FLATPAK_DEST}/share/applications/com.keithvassallo.SmartDnd.desktop
      - install -Dm644 data/com.keithvassallo.SmartDnd.metainfo.xml ${FLATPAK_DEST}/share/metainfo/com.keithvassallo.SmartDnd.metainfo.xml
      - install -Dm644 data/icons/hicolor/scalable/apps/com.keithvassallo.SmartDnd.svg ${FLATPAK_DEST}/share/icons/hicolor/scalable/apps/com.keithvassallo.SmartDnd.svg
      - install -Dm644 data/icons/hicolor/symbolic/apps/com.keithvassallo.SmartDnd-symbolic.svg ${FLATPAK_DEST}/share/icons/hicolor/symbolic/apps/com.keithvassallo.SmartDnd-symbolic.svg
      - for s in 16 32 48 64 128 256 512; do install -Dm644 data/icons/hicolor/${s}x${s}/apps/com.keithvassallo.SmartDnd.png ${FLATPAK_DEST}/share/icons/hicolor/${s}x${s}/apps/com.keithvassallo.SmartDnd.png; done
      - install -Dm644 LICENSE ${FLATPAK_DEST}/share/licenses/com.keithvassallo.SmartDnd/LICENSE
    sources:
      # Local and CI builds use the working tree. packaging/flatpak/friendlyhub-manifest.py
      # swaps this for the release's git tag when preparing the FriendlyHub submission.
      - type: dir
        path: ../..
        skip:
          - .git
          - .venv
          - .flatpak-builder
          - build-flatpak
