name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  test:
    runs-on: ubuntu-latest
    # Normally about a minute; fail fast instead of GitHub's 6-hour default if a mirror hangs.
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7

      # Test on the distro PyGObject stack the app runs on. PyGObject publishes no
      # wheels, so installing it from PyPI would compile it (and pycairo) from source.
      - name: Install system dependencies
        timeout-minutes: 10
        env:
          # A dead mirror connection times out and is retried instead of stalling the job.
          APT_OPTS: -o Acquire::Retries=3 -o Acquire::http::Timeout=30 -o Acquire::https::Timeout=30
        run: |
          sudo apt-get $APT_OPTS update
          # Without recommends: GTK 4's pull in Mesa, GStreamer and icon themes the tests don't use.
          sudo apt-get $APT_OPTS install -y --no-install-recommends \
            python3 \
            python3-venv \
            python3-gi \
            gir1.2-glib-2.0 \
            gir1.2-gdkpixbuf-2.0 \
            gir1.2-gtk-4.0 \
            gir1.2-adw-1 \
            gir1.2-ecal-2.0 \
            gir1.2-edataserver-1.2

      - name: Install smart-dnd
        run: |
          /usr/bin/python3 -m venv --system-site-packages .venv
          .venv/bin/pip install pytest
          .venv/bin/pip install -e .

      - name: Run tests
        run: .venv/bin/pytest -v
