name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      # Test on the distro PyGObject stack the app runs on. PyGObject publishes no
      # wheels, so installing it from PyPI would compile it (and pycairo) from source.
      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            python3 \
            python3-venv \
            python3-gi \
            gir1.2-glib-2.0 \
            gir1.2-gdkpixbuf-2.0 \
            gir1.2-gtk-4.0 \
            gir1.2-adw-1 \
            gir1.2-ecal-2.0 \
            gir1.2-edataserver-1.2

      - name: Install smart-dnd
        run: |
          /usr/bin/python3 -m venv --system-site-packages .venv
          .venv/bin/pip install pytest
          .venv/bin/pip install -e .

      - name: Run tests
        run: .venv/bin/pytest -v
