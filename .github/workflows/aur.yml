name: AUR

on:
  # Called by release.yml after the GitHub release succeeds (and in its dry runs).
  workflow_call:
    inputs:
      version:
        type: string
        required: true
      publish:
        type: boolean
        required: true
  # Publish an existing release by hand, e.g. after fixing a failed AUR job:
  #   gh workflow run aur.yml -f version=0.1.0
  workflow_dispatch:
    inputs:
      version:
        description: Released version to publish, e.g. 0.1.0 (its v tag must exist)
        required: true
      publish:
        description: Push to the AUR (off builds and tests only, from this checkout)
        type: boolean
        default: true

permissions:
  contents: read

jobs:
  aur:
    name: AUR package
    runs-on: ubuntu-latest
    timeout-minutes: 30
    container:
      image: archlinux:base-devel
    env:
      VERSION: ${{ inputs.version }}
      PUBLISH: ${{ inputs.publish }}
    steps:
      - name: Install tools
        run: pacman -Syu --noconfirm --needed git openssh pacman-contrib python-build python-installer python-hatchling
      - uses: actions/checkout@v7
      - name: Prepare PKGBUILD and .SRCINFO
        run: |
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          useradd --create-home builder
          mkdir aur-build
          sed -e "s/^pkgver=.*/pkgver=$VERSION/" -e "s/^pkgrel=.*/pkgrel=1/" packaging/aur/smart-dnd/PKGBUILD > aur-build/PKGBUILD
          if [ "$PUBLISH" != true ]; then
            # Not publishing: the tag tarball may not exist, so build from this checkout.
            git archive --format=tar.gz --prefix="smart-dnd-linux-$VERSION/" -o "aur-build/smart-dnd-$VERSION.tar.gz" HEAD
            sed -i 's|^source=.*|source=("$pkgname-$pkgver.tar.gz")|' aur-build/PKGBUILD
          fi
          chown -R builder aur-build
          cd aur-build
          sudo -u builder updpkgsums
          sudo -u builder makepkg --printsrcinfo > .SRCINFO
          cat PKGBUILD .SRCINFO
      - name: Test build
        working-directory: aur-build
        run: sudo -u builder makepkg --nodeps --noconfirm
      - name: Publish to the AUR
        if: ${{ inputs.publish }}
        env:
          AUR_SSH_PRIVATE_KEY: ${{ secrets.AUR_SSH_PRIVATE_KEY }}
        run: |
          if [ -z "$AUR_SSH_PRIVATE_KEY" ]; then
            echo "::error::AUR_SSH_PRIVATE_KEY secret is not set; see docs/releasing.md"
            exit 1
          fi
          # Explicit paths: in container jobs $HOME is /github/home, but ssh looks for
          # its files in the passwd home (/root) and would ignore anything under $HOME.
          ssh_dir="$HOME/.ssh"
          install -d -m 700 "$ssh_dir"
          printf '%s\n' "$AUR_SSH_PRIVATE_KEY" > "$ssh_dir/aur"
          chmod 600 "$ssh_dir/aur"
          # Pinned host key, fingerprint SHA256:RFzBCUItH9LZS0cKB5UE6ceAYhBD5C8GeOBip8Z11+4
          # as published on https://aur.archlinux.org
          echo 'aur.archlinux.org ssh-ed25519 AAAAC3NzaC1lZDI1NTE5AAAAIEuBKrPzbawxA/k2g6NcyV5jmqwJ2s+zpgZGZ7tpLIcN' > "$ssh_dir/known_hosts"
          export GIT_SSH_COMMAND="ssh -i $ssh_dir/aur -o IdentitiesOnly=yes -o UserKnownHostsFile=$ssh_dir/known_hosts -o StrictHostKeyChecking=yes"
          git clone ssh://aur@aur.archlinux.org/smart-dnd.git aur-repo
          cp aur-build/PKGBUILD aur-build/.SRCINFO aur-repo/
          cd aur-repo
          git config user.name "Keith Vassallo"
          git config user.email "keith@vassallo.cloud"
          git add PKGBUILD .SRCINFO
          if git diff --cached --quiet; then
            echo "AUR package already up to date"
          else
            git commit -m "Update to $VERSION"
            git push origin HEAD:master
          fi
