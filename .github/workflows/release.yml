name: Release

on:
  push:
    tags:
      - 'v*'
  # Dry run from the Actions tab: builds and tests every package, publishes nothing.
  workflow_dispatch:

permissions:
  contents: read

jobs:
  version:
    name: Check version
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      version: ${{ steps.check.outputs.version }}
      publish: ${{ steps.check.outputs.publish }}
    steps:
      - uses: actions/checkout@v7
      - id: check
        name: Check version strings agree (and match the tag)
        run: |
          if [ "$GITHUB_REF_TYPE" = tag ]; then
            version=$(python3 packaging/check-version.py "$GITHUB_REF_NAME")
          else
            version=$(python3 packaging/check-version.py)
          fi
          publish=false
          if [ "$GITHUB_EVENT_NAME" = push ]; then publish=true; fi
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "publish=$publish" >> "$GITHUB_OUTPUT"
          echo "Version $version (publish: $publish)"
      - name: Check CHANGELOG.md has this version's release notes
        run: python3 packaging/release.py notes "${{ steps.check.outputs.version }}"

  python:
    name: Wheel and sdist
    needs: version
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.x'
      - name: Build
        run: |
          python -m pip install build
          python -m build
      - uses: actions/upload-artifact@v7
        with:
          name: python-dist
          path: dist/*

  deb:
    name: Debian / Ubuntu package
    needs: version
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      VERSION: ${{ needs.version.outputs.version }}
    steps:
      - uses: actions/checkout@v7
      - name: Install packaging dependencies
        env:
          # A dead mirror connection times out and is retried instead of stalling the job.
          APT_OPTS: -o Acquire::Retries=3 -o Acquire::http::Timeout=30 -o Acquire::https::Timeout=30
        run: |
          sudo apt-get $APT_OPTS update
          sudo apt-get $APT_OPTS install -y build-essential debhelper dh-python pybuild-plugin-pyproject python3-all python3-hatchling
      - name: Build .deb
        run: |
          cp -r packaging/debian debian
          sed -i "1s/([^)]*)/($VERSION-1)/" debian/changelog
          dpkg-buildpackage -us -uc -b
          mkdir -p deb-dist
          mv ../smart-dnd_*.deb deb-dist/
      - name: Install and smoke-test
        env:
          # A dead mirror connection times out and is retried instead of stalling the job.
          APT_OPTS: -o Acquire::Retries=3 -o Acquire::http::Timeout=30 -o Acquire::https::Timeout=30
        run: |
          sudo apt-get $APT_OPTS install -y ./deb-dist/*.deb
          smart-dnd plugins
          test -f /etc/xdg/autostart/com.keithvassallo.SmartDnd.desktop
      - uses: actions/upload-artifact@v7
        with:
          name: deb
          path: deb-dist/*

  rpm:
    name: Fedora package
    needs: version
    runs-on: ubuntu-latest
    timeout-minutes: 30
    container:
      image: fedora:latest
    env:
      VERSION: ${{ needs.version.outputs.version }}
    steps:
      # git before checkout, so checkout makes a real clone that git archive can read.
      - name: Install packaging dependencies
        run: dnf install -y git rpm-build python3-devel pyproject-rpm-macros python3-pip python3-hatchling
      - uses: actions/checkout@v7
      - name: Build .rpm
        run: |
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          mkdir -p ~/rpmbuild/SOURCES ~/rpmbuild/SPECS
          git archive --format=tar.gz --prefix="smart-dnd-$VERSION/" -o ~/rpmbuild/SOURCES/smart-dnd-$VERSION.tar.gz HEAD
          sed "s/^Version:.*/Version:        $VERSION/" packaging/rpm/smart-dnd.spec > ~/rpmbuild/SPECS/smart-dnd.spec
          rpmbuild -ba ~/rpmbuild/SPECS/smart-dnd.spec
          mkdir -p rpm-dist
          cp ~/rpmbuild/RPMS/noarch/*.rpm rpm-dist/
      - name: Install and smoke-test
        run: |
          dnf install -y rpm-dist/*.rpm
          smart-dnd plugins
          test -f /etc/xdg/autostart/com.keithvassallo.SmartDnd.desktop
      - uses: actions/upload-artifact@v7
        with:
          name: rpm
          path: rpm-dist/*

  flatpak:
    name: Flatpak bundle
    needs: version
    runs-on: ubuntu-latest
    timeout-minutes: 60
    container:
      image: ghcr.io/flathub-infra/flatpak-github-actions:gnome-51
      options: --privileged
    steps:
      - uses: actions/checkout@v7
      - uses: flatpak/flatpak-github-actions/flatpak-builder@v6
        with:
          manifest-path: packaging/flatpak/com.keithvassallo.SmartDnd.yaml
          bundle: smart-dnd-${{ needs.version.outputs.version }}-x86_64.flatpak
          artifact-name: flatpak

  # FriendlyHub builds from a git tag, so its manifest points at this release's tag
  # rather than the working tree. Attached to the release for the FriendlyHub PR.
  friendlyhub:
    name: FriendlyHub submission files
    needs: version
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      VERSION: ${{ needs.version.outputs.version }}
    steps:
      - uses: actions/checkout@v7
      - name: Generate manifest
        run: |
          mkdir friendlyhub
          python3 packaging/flatpak/friendlyhub-manifest.py "v$VERSION" "$GITHUB_SHA" > friendlyhub/com.keithvassallo.SmartDnd.yaml
          cp data/com.keithvassallo.SmartDnd.metainfo.xml friendlyhub/
      - uses: actions/upload-artifact@v7
        with:
          name: friendlyhub
          path: friendlyhub/*

  release:
    name: GitHub release
    needs: [version, python, deb, rpm, flatpak, friendlyhub]
    if: needs.version.outputs.publish == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
    env:
      VERSION: ${{ needs.version.outputs.version }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v8
        with:
          path: release-assets
          merge-multiple: true
      - name: Generate checksums
        working-directory: release-assets
        run: sha256sum * | tee SHA256SUMS
      - name: Write release notes
        run: |
          {
            python3 packaging/release.py notes "$VERSION"
            cat <<EOF

          ## Install

          - **Flatpak**: from [FriendlyHub](https://friendlyhub.org), or \`smart-dnd-$VERSION-x86_64.flatpak\` below
          - **Arch Linux**: [\`smart-dnd\`](https://aur.archlinux.org/packages/smart-dnd) on the AUR
          - **Debian / Ubuntu**: \`smart-dnd_$VERSION-1_all.deb\`
          - **Fedora**: the \`.rpm\` below
          - **Python**: \`smart_dnd_linux-$VERSION-py3-none-any.whl\`

          \`SHA256SUMS\` lists the checksum of every file.
          EOF
          } > release-notes.md
          cat release-notes.md
      # The changelog section, then GitHub's generated "Full Changelog" link.
      - uses: softprops/action-gh-release@v3
        with:
          name: Smart DND ${{ needs.version.outputs.version }}
          body_path: release-notes.md
          files: release-assets/*
          generate_release_notes: true

  aur:
    name: AUR package
    needs: [version, release]
    # Tag pushes publish only once the GitHub release exists; dry runs (release
    # skipped) still build and test the PKGBUILD.
    if: >-
      !cancelled() && needs.version.result == 'success' &&
      (needs.release.result == 'success' ||
       (needs.release.result == 'skipped' && needs.version.outputs.publish != 'true'))
    runs-on: ubuntu-latest
    timeout-minutes: 30
    container:
      image: archlinux:base-devel
    env:
      VERSION: ${{ needs.version.outputs.version }}
      PUBLISH: ${{ needs.version.outputs.publish }}
    steps:
      - name: Install tools
        run: pacman -Syu --noconfirm --needed git openssh pacman-contrib python-build python-installer python-hatchling
      - uses: actions/checkout@v7
      - name: Prepare PKGBUILD and .SRCINFO
        run: |
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          useradd --create-home builder
          mkdir aur-build
          sed -e "s/^pkgver=.*/pkgver=$VERSION/" -e "s/^pkgrel=.*/pkgrel=1/" packaging/aur/smart-dnd/PKGBUILD > aur-build/PKGBUILD
          if [ "$PUBLISH" != true ]; then
            # Dry run: the tag tarball doesn't exist, so build from this checkout instead.
            git archive --format=tar.gz --prefix="smart-dnd-linux-$VERSION/" -o "aur-build/smart-dnd-$VERSION.tar.gz" HEAD
            sed -i 's|^source=.*|source=("$pkgname-$pkgver.tar.gz")|' aur-build/PKGBUILD
          fi
          chown -R builder aur-build
          cd aur-build
          sudo -u builder updpkgsums
          sudo -u builder makepkg --printsrcinfo > .SRCINFO
          cat PKGBUILD .SRCINFO
      - name: Test build
        working-directory: aur-build
        run: sudo -u builder makepkg --nodeps --noconfirm
      - name: Publish to the AUR
        if: needs.version.outputs.publish == 'true'
        env:
          AUR_SSH_PRIVATE_KEY: ${{ secrets.AUR_SSH_PRIVATE_KEY }}
        run: |
          if [ -z "$AUR_SSH_PRIVATE_KEY" ]; then
            echo "::error::AUR_SSH_PRIVATE_KEY secret is not set; see docs/releasing.md"
            exit 1
          fi
          install -d -m 700 ~/.ssh
          printf '%s\n' "$AUR_SSH_PRIVATE_KEY" > ~/.ssh/aur
          chmod 600 ~/.ssh/aur
          # Pinned host key, fingerprint SHA256:RFzBCUItH9LZS0cKB5UE6ceAYhBD5C8GeOBip8Z11+4
          # as published on https://aur.archlinux.org
          echo 'aur.archlinux.org ssh-ed25519 AAAAC3NzaC1lZDI1NTE5AAAAIEuBKrPzbawxA/k2g6NcyV5jmqwJ2s+zpgZGZ7tpLIcN' > ~/.ssh/known_hosts
          export GIT_SSH_COMMAND="ssh -i $HOME/.ssh/aur -o IdentitiesOnly=yes"
          git clone ssh://aur@aur.archlinux.org/smart-dnd.git aur-repo
          cp aur-build/PKGBUILD aur-build/.SRCINFO aur-repo/
          cd aur-repo
          git config user.name "Keith Vassallo"
          git config user.email "keith@vassallo.cloud"
          git add PKGBUILD .SRCINFO
          if git diff --cached --quiet; then
            echo "AUR package already up to date"
          else
            git commit -m "Update to $VERSION"
            git push origin HEAD:master
          fi
